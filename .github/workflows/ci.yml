name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      GEMINI_API_KEY: ci-placeholder-key
      QUOTA_RPM: "10"
      QUOTA_RPD: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        working-directory: api
        run: pip install -e ".[dev]"
      - name: ruff
        working-directory: api
        run: ruff check .
      - name: mypy
        working-directory: api
        run: mypy .
      - name: pytest
        working-directory: api
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: build
        working-directory: web
        run: npm run build
      - name: test
        working-directory: web
        run: npm run test
